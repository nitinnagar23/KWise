name: Build Android APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Prepare Keystore & Environment
        env:
          GOOGLE_SERVICES_JSON_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
          DEBUG_KEYSTORE_SECRET: ${{ secrets.DEBUG_KEYSTORE }}
          RELEASE_KEYSTORE_SECRET: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          IS_RELEASE_BUILD: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release') || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          # 1. Restore debug.keystore from GitHub Secret or debug.keystore.base64
          if [ -n "$DEBUG_KEYSTORE_SECRET" ]; then
            echo "Restoring debug.keystore from DEBUG_KEYSTORE secret..."
            echo "$DEBUG_KEYSTORE_SECRET" | base64 -d > debug.keystore
          elif [ -f "debug.keystore.base64" ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          # 2. For release builds, require a stable upload keystore from secrets
          if [ "$IS_RELEASE_BUILD" = "true" ]; then
            if [ -n "$RELEASE_KEYSTORE_SECRET" ]; then
              echo "Restoring my-upload-key.jks from RELEASE_KEYSTORE_BASE64 secret..."
              echo "$RELEASE_KEYSTORE_SECRET" | base64 -d > my-upload-key.jks
            fi
            if [ ! -s "my-upload-key.jks" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
              echo "Error: Stable release signing secrets (RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD) are required for release builds so app updates never fail with signature conflicts." >&2
              exit 1
            fi
          else
            if [ ! -s "debug.keystore" ]; then
              echo "Error: Stable DEBUG_KEYSTORE secret (or debug.keystore.base64) is required so debug APK updates maintain a consistent signature." >&2
              exit 1
            fi
          fi

          # 3. Ensure .env exists so Secrets Gradle plugin succeeds
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # 4. Restore google-services.json if missing
          if [ ! -f "app/google-services.json" ]; then
            if [ -n "$GOOGLE_SERVICES_JSON_SECRET" ]; then
              echo "$GOOGLE_SERVICES_JSON_SECRET" | base64 -d > app/google-services.json 2>/dev/null || echo "$GOOGLE_SERVICES_JSON_SECRET" > app/google-services.json
            elif [ -f "app/google-services.json.base64" ]; then
              base64 -d app/google-services.json.base64 > app/google-services.json 2>/dev/null || true
            fi
          fi

      - name: Build Debug APK
        if: "${{ !startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'debug') }}"
        run: |
          ./gradlew assembleDebug -Djava.awt.headless=true --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk KhataWise.apk

      - name: Build Release APK
        if: "${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release') }}"
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease -Djava.awt.headless=true --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk KhataWise.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: KhataWise-APK
          path: KhataWise.apk
          retention-days: 30

      - name: Publish Direct APK to GitHub Releases
        if: "${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release') }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
        run: |
          gh release create "$RELEASE_TAG" KhataWise.apk --title "KhataWise $RELEASE_TAG" --notes "Direct installable Android APK." --clobber 2>/dev/null || \
          gh release upload "$RELEASE_TAG" KhataWise.apk --clobber
